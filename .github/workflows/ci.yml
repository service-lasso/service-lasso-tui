name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} test and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/service-lasso-tui
      - name: Test direct-probe evidence guards
        run: node --test scripts/verify-real-core-conpty.test.mjs
  windows-direct-core-conpty:
    name: Windows direct Core ConPTY read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out pinned Core source
        uses: actions/checkout@v5
        with:
          repository: service-lasso/service-lasso
          ref: d9e2ae799244317940c862fe1261dfd22b7bdda1
          path: core
      - name: Install bounded ConPTY helper
        run: python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-conpty.txt
      - name: Install pinned Core dependencies
        run: npm ci --prefix core
      - name: Run direct read-only Core ConPTY probe
        run: node scripts/verify-real-core-conpty.mjs --core-root core
  release-asset-compile:
    name: Release asset cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile declared release targets
        shell: bash
        run: |
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = windows ]; then extension=.exe; fi
            GOOS="$os" GOARCH="$arch" go build -o "service-lasso-tui-${os}-${arch}${extension}" ./cmd/service-lasso-tui
          done
