name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Windows, Linux, and macOS executables
        shell: bash
        run: |
          for target in windows linux darwin; do
            extension=""
            if [ "$target" = windows ]; then extension=.exe; fi
            GOOS="$target" GOARCH=amd64 go build -o "service-lasso-tui-${target}-amd64${extension}" ./cmd/service-lasso-tui
          done
