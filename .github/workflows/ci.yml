name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: ${{ matrix.name }} test and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test clean source and build the checked revision
        shell: pwsh
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          go test -mod=readonly ./...
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -ne $env:CI_SOURCE_SHA) { throw 'checked-out source identity does not match the selected immutable source SHA' }
          $binary = Join-Path $env:RUNNER_TEMP 'service-lasso-tui-check'
          go build -mod=readonly -buildvcs=true -o $binary ./cmd/service-lasso-tui
          $metadata = (go version -m $binary) -join "`n"
          if ($metadata -notmatch "vcs.revision=$sourceCommit" -or $metadata -notmatch 'vcs.modified=false') { throw 'built binary does not carry the clean checked-out VCS identity' }
      - name: Install pinned Windows ConPTY helper
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run real Windows ConPTY unavailable-state probe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-conpty.txt
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[a-f0-9]{40}$') { throw 'invalid checked-out source identity' }
          if ($sourceCommit -ne $env:CI_SOURCE_SHA) { throw 'checked-out source identity does not match the selected immutable source SHA' }
          $binary = Join-Path $env:RUNNER_TEMP 'service-lasso-tui.exe'
          go build -mod=readonly -buildvcs=true -o $binary ./cmd/service-lasso-tui
          $metadata = (go version -m $binary) -join "`n"
          if ($metadata -notmatch "vcs.revision=$sourceCommit" -or $metadata -notmatch 'vcs.modified=false') { throw 'probe binary does not carry the clean checked-out VCS identity' }
          $binarySHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          [ordered]@{
            sourceCommit = $sourceCommit
            binarySHA256 = $binarySHA256
            build = 'go-build-mod-readonly-buildvcs-true'
            goflags = 'cleared'
            gowork = 'off'
          } | ConvertTo-Json -Compress | Set-Content -NoNewline -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'service-lasso-tui-probe-provenance.json')
          python scripts/verify-release-asset-conpty.py --executable $binary --mode unavailable --api-url http://127.0.0.1:1 --source-commit $sourceCommit --expected-executable-sha256 $binarySHA256
      - name: Retain failed Windows constructor candidate
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-lasso-tui-windows-constructor-failure-${{ env.CI_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/service-lasso-tui.exe
            ${{ runner.temp }}/service-lasso-tui-probe-provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Test direct-probe evidence guards
        run: |
          python scripts/verify-release-asset-conpty-python.test.py
          node --test scripts/verify-real-core-conpty.test.mjs scripts/verify-release-asset-conpty.test.mjs scripts/verify-candidate-publication.test.mjs scripts/verify-candidate-publication-fresh-job.test.mjs

  native-posix-lifecycle:
    name: ${{ matrix.name }} native PTY Core lifecycle acceptance
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    env:
      CORE_COMMIT: 2633c07be25512d0a84f9bfa28de6be5edff35e8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Build exact native TUI and exact Core source
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          attempt="$RUNNER_TEMP/tui20-native-${{ matrix.name }}-$CI_SOURCE_SHA"
          mkdir -p "$attempt/core-source" "$attempt/registry" "$attempt/workspace"
          export SERVICE_LASSO_WORKSPACE_ROOT="$attempt/workspace"
          export SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$attempt/registry/instances.json"
          export SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$attempt/registry/ports.json"
          git -C "$attempt/core-source" init -q
          git -C "$attempt/core-source" remote add origin https://github.com/service-lasso/service-lasso.git
          git -C "$attempt/core-source" fetch --depth=1 origin "$CORE_COMMIT"
          git -C "$attempt/core-source" checkout --detach -q FETCH_HEAD
          test "$(git -C "$attempt/core-source" rev-parse HEAD)" = "$CORE_COMMIT"
          test -z "$(git -C "$attempt/core-source" status --porcelain)"
          (
            cd "$attempt/core-source"
            SERVICE_LASSO_WORKSPACE_ROOT="$SERVICE_LASSO_WORKSPACE_ROOT" SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$SERVICE_LASSO_INSTANCE_REGISTRY_PATH" SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$SERVICE_LASSO_HOST_PORT_REGISTRY_PATH" npm ci
            SERVICE_LASSO_WORKSPACE_ROOT="$SERVICE_LASSO_WORKSPACE_ROOT" SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$SERVICE_LASSO_INSTANCE_REGISTRY_PATH" SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$SERVICE_LASSO_HOST_PORT_REGISTRY_PATH" npm run build
          )
          binary="$attempt/service-lasso-tui"
          go build -mod=readonly -buildvcs=true -trimpath -o "$binary" ./cmd/service-lasso-tui
          go version -m "$binary" | grep -F "vcs.revision=$CI_SOURCE_SHA" >/dev/null
          go version -m "$binary" | grep -F 'vcs.modified=false' >/dev/null
          sha256sum "$binary" > "$attempt/binary.sha256"
          node -e 'const fs=require("fs"); const path=process.argv[1]; fs.writeFileSync(path+"/head-tree.json", JSON.stringify({tuiCommit:process.env.CI_SOURCE_SHA,coreCommit:process.env.CORE_COMMIT,tuiClean:true,coreClean:true},null,2));' "$attempt"
          SERVICE_LASSO_WORKSPACE_ROOT="$SERVICE_LASSO_WORKSPACE_ROOT" SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$SERVICE_LASSO_INSTANCE_REGISTRY_PATH" SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$SERVICE_LASSO_HOST_PORT_REGISTRY_PATH" node scripts/tui20-native-core.mjs --root "$attempt" --executable "$binary" --source-commit "$CI_SOURCE_SHA" --core-commit "$CORE_COMMIT" --helper scripts/tui20-native-posix-five-action.py
      - name: Retain native direct-evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui20-native-${{ matrix.name }}-lifecycle-${{ env.CI_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/binary.sha256
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/head-tree.json
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/ready.json
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/native-terminal.txt
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/native-exit-receipt.json
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/operation-audit.json
            ${{ runner.temp }}/tui20-native-${{ matrix.name }}-${{ env.CI_SOURCE_SHA }}/core-parent-exit.json
          if-no-files-found: warn
          retention-days: 90
  release-asset-compile:
    name: Release asset cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile declared release targets
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$CI_SOURCE_SHA"
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = windows ]; then extension=.exe; fi
            binary="$RUNNER_TEMP/service-lasso-tui-${os}-${arch}${extension}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -buildvcs=true -o "$binary" ./cmd/service-lasso-tui
            go version -m "$binary" | grep -F "vcs.revision=$source_commit" >/dev/null
            go version -m "$binary" | grep -F 'vcs.modified=false' >/dev/null
          done
