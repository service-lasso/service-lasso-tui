name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} test and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/service-lasso-tui
      - name: Install pinned Windows ConPTY helper
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run real Windows ConPTY unavailable-state probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-conpty.txt
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[a-f0-9]{40}$') { throw 'invalid checked-out source identity' }
          if ((go list -m) -ne 'github.com/service-lasso/service-lasso-tui') { throw 'unexpected Go module identity' }
          go build -buildvcs=true -o service-lasso-tui.exe ./cmd/service-lasso-tui
          $binarySHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath service-lasso-tui.exe).Hash.ToLowerInvariant()
          python scripts/verify-release-asset-conpty.py --executable service-lasso-tui.exe --mode unavailable --api-url http://127.0.0.1:1 --source-commit $sourceCommit --expected-executable-sha256 $binarySHA256
      - name: Test direct-probe evidence guards
        run: |
          python scripts/verify-release-asset-conpty-python.test.py
          node --test scripts/verify-real-core-conpty.test.mjs scripts/verify-release-asset-conpty.test.mjs
  release-asset-compile:
    name: Release asset cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile declared release targets
        shell: bash
        run: |
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = windows ]; then extension=.exe; fi
            GOOS="$os" GOARCH="$arch" go build -o "service-lasso-tui-${os}-${arch}${extension}" ./cmd/service-lasso-tui
          done
