name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} test and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test clean source and build the checked revision
        shell: pwsh
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          go test -mod=readonly ./...
          $sourceCommit = (git rev-parse HEAD).Trim()
          $binary = Join-Path $env:RUNNER_TEMP 'service-lasso-tui-check'
          go build -mod=readonly -buildvcs=true -o $binary ./cmd/service-lasso-tui
          $metadata = go version -m $binary
          if ($metadata -notmatch "vcs.revision=$sourceCommit" -or $metadata -notmatch 'vcs.modified=false') { throw 'built binary does not carry the clean checked-out VCS identity' }
      - name: Install pinned Windows ConPTY helper
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run real Windows ConPTY unavailable-state probe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-conpty.txt
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[a-f0-9]{40}$') { throw 'invalid checked-out source identity' }
          $binary = Join-Path $env:RUNNER_TEMP 'service-lasso-tui.exe'
          go build -mod=readonly -buildvcs=true -o $binary ./cmd/service-lasso-tui
          $metadata = go version -m $binary
          if ($metadata -notmatch "vcs.revision=$sourceCommit" -or $metadata -notmatch 'vcs.modified=false') { throw 'probe binary does not carry the clean checked-out VCS identity' }
          $binarySHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          python scripts/verify-release-asset-conpty.py --executable $binary --mode unavailable --api-url http://127.0.0.1:1 --source-commit $sourceCommit --expected-executable-sha256 $binarySHA256
      - name: Test direct-probe evidence guards
        run: |
          python scripts/verify-release-asset-conpty-python.test.py
          node --test scripts/verify-real-core-conpty.test.mjs scripts/verify-release-asset-conpty.test.mjs
  release-asset-compile:
    name: Release asset cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile declared release targets
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          source_commit="$(git rev-parse HEAD)"
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = windows ]; then extension=.exe; fi
            binary="$RUNNER_TEMP/service-lasso-tui-${os}-${arch}${extension}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -buildvcs=true -o "$binary" ./cmd/service-lasso-tui
            go version -m "$binary" | grep -F "vcs.revision=$source_commit" >/dev/null
            go version -m "$binary" | grep -F 'vcs.modified=false' >/dev/null
          done
