name: Publish protected develop TUI candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Exact yyyy.m.d-shortsha candidate version for the current develop commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind explicit candidate identity to the current develop source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${#GITHUB_SHA}" = 40
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-[0-9a-f]{7}$ ]]
          test "${CANDIDATE_VERSION##*-}" = "${GITHUB_SHA:0:7}"
          printf 'sha=%s\nversion=%s\ntag=candidate-%s\n' "$GITHUB_SHA" "$CANDIDATE_VERSION" "$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"

  platform-smoke:
    needs: validate-source
    name: ${{ matrix.name }} source and terminal smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test clean source
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          go test -mod=readonly ./...
      - name: Build and smoke the attached-terminal entrypoint
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          set -euo pipefail
          node scripts/assert-go-source-provenance.mjs
          binary="$RUNNER_TEMP/service-lasso-tui"
          go build -mod=readonly -buildvcs=true -trimpath -ldflags='-s -w' -o "$binary" ./cmd/service-lasso-tui
          go version -m "$binary" | grep -F "vcs.revision=${{ needs.validate-source.outputs.sha }}" >/dev/null
          go version -m "$binary" | grep -F 'vcs.modified=false' >/dev/null
          "$binary" --help >/dev/null

  package-candidate:
    needs: [validate-source, platform-smoke]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
      CANDIDATE_TAG: ${{ needs.validate-source.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build and archive one exact four-platform candidate
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/assert-go-source-provenance.mjs
          mkdir -p release-assets/stage
          declare -a targets=(
            "windows amd64 zip service-lasso-tui.exe win32-amd64"
            "linux amd64 tar service-lasso-tui linux-amd64"
            "darwin amd64 tar service-lasso-tui darwin-amd64"
            "darwin arm64 tar service-lasso-tui darwin-arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch archive_kind executable suffix <<< "$target"
            staged="release-assets/stage/$executable"
            asset_base="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -mod=readonly -buildvcs=true -trimpath -ldflags='-s -w' -o "$staged" ./cmd/service-lasso-tui
            test -s "$staged"
            go version -m "$staged" | grep -F "vcs.revision=$CANDIDATE_SHA" >/dev/null
            go version -m "$staged" | grep -F 'vcs.modified=false' >/dev/null
            if [ "$archive_kind" = zip ]; then (cd release-assets/stage && zip -q "../${asset_base}.zip" "$executable"); else (cd release-assets/stage && tar -czf "../${asset_base}.tar.gz" "$executable"); fi
            rm -f "$staged"
          done
          rmdir release-assets/stage
          (cd release-assets && sha256sum service-lasso-tui-"$CANDIDATE_VERSION"-* > SHA256SUMS.txt)
      - name: Verify checksums, extraction paths, and embedded VCS provenance
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt
          declare -a targets=("win32-amd64 zip service-lasso-tui.exe" "linux-amd64 tar service-lasso-tui" "darwin-amd64 tar service-lasso-tui" "darwin-arm64 tar service-lasso-tui")
          for target in "${targets[@]}"; do
            read -r suffix kind executable <<< "$target"
            asset="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}"
            extraction_root="$(mktemp -d)"
            if [ "$kind" = zip ]; then test "$(unzip -Z1 "$asset.zip")" = "$executable"; unzip -q "$asset.zip" -d "$extraction_root"; else test "$(tar -tzf "$asset.tar.gz")" = "$executable"; tar -xzf "$asset.tar.gz" -C "$extraction_root"; fi
            go version -m "$extraction_root/$executable" | grep -F "vcs.revision=$CANDIDATE_SHA" >/dev/null
            go version -m "$extraction_root/$executable" | grep -F 'vcs.modified=false' >/dev/null
            rm -rf "$extraction_root"
          done
      - name: Write candidate manifest and local byte inventory
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          checksum_manifest_sha256="$(sha256sum SHA256SUMS.txt | cut -d ' ' -f1)"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sourceRef "$GITHUB_REF" --arg sourceCommit "$CANDIDATE_SHA" --arg tag "$CANDIDATE_TAG" --arg version "$CANDIDATE_VERSION" --arg checksumManifestSha256 "$checksum_manifest_sha256" \
            --arg win32 "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" --arg linux "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz" --arg darwinAmd64 "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz" --arg darwinArm64 "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz" \
            --arg win32Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" | cut -d ' ' -f1)" --arg linuxSha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz" | cut -d ' ' -f1)" --arg darwinAmd64Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz" | cut -d ' ' -f1)" --arg darwinArm64Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz" | cut -d ' ' -f1)" \
            '{schemaVersion: 2, kind: "develop-prerelease-candidate", source: {repository: $repository, ref: $sourceRef, commit: $sourceCommit}, release: {tag: $tag, prerelease: true, draft: false, immutable: true}, version: $version, checksumManifest: {name: "SHA256SUMS.txt", sha256: $checksumManifestSha256}, corePackagingIssue: "service-lasso/service-lasso#1461", assets: [{platform: "win32-amd64", name: $win32, sha256: $win32Sha256, executable: "service-lasso-tui.exe"}, {platform: "linux-amd64", name: $linux, sha256: $linuxSha256, executable: "service-lasso-tui"}, {platform: "darwin-amd64", name: $darwinAmd64, sha256: $darwinAmd64Sha256, executable: "service-lasso-tui"}, {platform: "darwin-arm64", name: $darwinArm64, sha256: $darwinArm64Sha256, executable: "service-lasso-tui"}]}' > candidate-manifest.json
          node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync, statSync } from "node:fs"; const inventory = {}; for (const name of process.argv.slice(1)) { const bytes = readFileSync(name); inventory[name] = { sha256: createHash("sha256").update(bytes).digest("hex"), size: statSync(name).size }; } process.stdout.write(JSON.stringify(inventory));' "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz" "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz" "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz" SHA256SUMS.txt candidate-manifest.json > candidate-local-assets.json
          node ../scripts/verify-candidate-publication-cli.mjs --mode publication-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --manifest candidate-manifest.json --local-assets candidate-local-assets.json --asset-directory .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-lasso-tui-candidate-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 90

  publish-candidate:
    needs: [validate-source, package-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development-candidate
    permissions:
      contents: write
    env:
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
      CANDIDATE_TAG: ${{ needs.validate-source.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Bind checked-out source before candidate artifact retrieval
        shell: bash
        run: |
          set -euo pipefail
          scripts/bind-candidate-publication-source.sh "$CANDIDATE_SHA" "$GITHUB_REF" "$RUNNER_TEMP/candidate-source-binding.json" "service-lasso-tui-candidate-${CANDIDATE_VERSION}-${CANDIDATE_SHA}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: service-lasso-tui-candidate-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: release-assets
      - name: Bind downloaded fixed candidate bytes before provider reads
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-candidate-publication-cli.mjs --mode publication-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --manifest release-assets/candidate-manifest.json --local-assets release-assets/candidate-local-assets.json --asset-directory release-assets
      - name: Publish or recover through the complete protected state machine
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-candidate.mjs --asset-directory release-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" > publication-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-lasso-tui-publication-receipt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: |
            release-assets
            publication-receipt.json
            ${{ runner.temp }}/candidate-source-binding.json
          if-no-files-found: error
          retention-days: 90
