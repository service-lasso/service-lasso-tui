name: Qualify develop TUI candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Exact yyyy.m.d-shortsha candidate version for this develop commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind explicit candidate identity to develop source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${#GITHUB_SHA}" = 40
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-[0-9a-f]{7}$ ]]
          test "${CANDIDATE_VERSION##*-}" = "${GITHUB_SHA:0:7}"
          printf 'sha=%s\nversion=%s\ntag=candidate-%s\n' "$GITHUB_SHA" "$CANDIDATE_VERSION" "$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
  platform-smoke:
    needs: validate-source
    name: ${{ matrix.name }} source and terminal smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test source
        run: go test ./...
      - name: Build and smoke the attached-terminal entrypoint
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-s -w' -o service-lasso-tui ./cmd/service-lasso-tui
          ./service-lasso-tui --help >/dev/null
  package-candidate:
    needs:
      - validate-source
      - platform-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
      CANDIDATE_TAG: ${{ needs.validate-source.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Recheck exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "${CANDIDATE_VERSION##*-}" = "${CANDIDATE_SHA:0:7}"
      - name: Build and archive exact platform assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/stage
          declare -a targets=(
            "windows amd64 zip service-lasso-tui.exe win32-amd64"
            "linux amd64 tar service-lasso-tui linux-amd64"
            "darwin amd64 tar service-lasso-tui darwin-amd64"
            "darwin arm64 tar service-lasso-tui darwin-arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch archive_kind executable suffix <<< "$target"
            staged="release-assets/stage/$executable"
            asset_base="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "$staged" ./cmd/service-lasso-tui
            test -s "$staged"
            go tool buildid "$staged" >/dev/null
            if [ "$archive_kind" = zip ]; then
              (cd release-assets/stage && zip -q "../${asset_base}.zip" "$executable")
            else
              (cd release-assets/stage && tar -czf "../${asset_base}.tar.gz" "$executable")
            fi
            rm -f "$staged"
          done
          rm -rf release-assets/stage
          (cd release-assets && sha256sum service-lasso-tui-"$CANDIDATE_VERSION"-* > SHA256SUMS.txt)
      - name: Verify checksums and extracted executable paths
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt
          test "$(unzip -Z1 "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip")" = "service-lasso-tui.exe"
          unzip -t "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" >/dev/null
          for suffix in linux-amd64 darwin-amd64 darwin-arm64; do
            asset="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}.tar.gz"
            test "$(tar -tzf "$asset")" = "service-lasso-tui"
            extraction_root="$(mktemp -d)"
            tar -xzf "$asset" -C "$extraction_root"
            test -s "$extraction_root/service-lasso-tui"
            go tool buildid "$extraction_root/service-lasso-tui" >/dev/null
            rm -rf "$extraction_root"
          done
      - name: Write Core packaging handoff manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          checksum_manifest_sha256="$(sha256sum SHA256SUMS.txt | cut -d ' ' -f1)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceRef "$GITHUB_REF" \
            --arg sourceCommit "$CANDIDATE_SHA" \
            --arg tag "$CANDIDATE_TAG" \
            --arg version "$CANDIDATE_VERSION" \
            --arg checksumManifestSha256 "$checksum_manifest_sha256" \
            --arg win32 "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" \
            --arg linux "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz" \
            --arg darwinAmd64 "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz" \
            --arg darwinArm64 "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz" \
            --arg win32Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip" | cut -d ' ' -f1)" \
            --arg linuxSha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz" | cut -d ' ' -f1)" \
            --arg darwinAmd64Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz" | cut -d ' ' -f1)" \
            --arg darwinArm64Sha256 "$(sha256sum "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz" | cut -d ' ' -f1)" \
            '{schemaVersion: 1, kind: "develop-prerelease-candidate", source: {repository: $repository, ref: $sourceRef, commit: $sourceCommit}, release: {tag: $tag, prerelease: true}, version: $version, checksumManifest: {name: "SHA256SUMS.txt", sha256: $checksumManifestSha256}, assets: [{platform: "win32-amd64", name: $win32, sha256: $win32Sha256, executable: "service-lasso-tui.exe"}, {platform: "linux-amd64", name: $linux, sha256: $linuxSha256, executable: "service-lasso-tui"}, {platform: "darwin-amd64", name: $darwinAmd64, sha256: $darwinAmd64Sha256, executable: "service-lasso-tui"}, {platform: "darwin-arm64", name: $darwinArm64, sha256: $darwinArm64Sha256, executable: "service-lasso-tui"}], corePackagingIssue: "service-lasso/service-lasso#1461"}' > candidate-manifest.json
          jq -e '
            .schemaVersion == 1 and
            .kind == "develop-prerelease-candidate" and
            (.source.commit | test("^[0-9a-f]{40}$")) and
            (.release.tag | test("^candidate-[0-9]{4}\\.[0-9]{1,2}\\.[0-9]{1,2}-[0-9a-f]{7}$")) and
            (.assets | length == 4) and
            ([.assets[].platform] | sort == ["darwin-amd64", "darwin-arm64", "linux-amd64", "win32-amd64"]) and
            all(.assets[]; (.sha256 | test("^[0-9a-f]{64}$")))
          ' candidate-manifest.json >/dev/null
      - name: Reject an existing candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Candidate release already exists: $CANDIDATE_TAG" >&2
            exit 1
          fi
      - name: Create immutable prerelease candidate
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CANDIDATE_TAG }}
          name: TUI candidate ${{ env.CANDIDATE_VERSION }}
          target_commitish: ${{ env.CANDIDATE_SHA }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/service-lasso-tui-${{ env.CANDIDATE_VERSION }}-win32-amd64.zip
            release-assets/service-lasso-tui-${{ env.CANDIDATE_VERSION }}-linux-amd64.tar.gz
            release-assets/service-lasso-tui-${{ env.CANDIDATE_VERSION }}-darwin-amd64.tar.gz
            release-assets/service-lasso-tui-${{ env.CANDIDATE_VERSION }}-darwin-arm64.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/candidate-manifest.json
          generate_release_notes: false
      - name: Read back the exact prerelease asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$CANDIDATE_TAG"
          test "$(jq -r '.targetCommitish' <<< "$release_json")" = "$CANDIDATE_SHA"
          test "$(jq -r '.isDraft' <<< "$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = "true"
          expected_assets=(
            "service-lasso-tui-${CANDIDATE_VERSION}-win32-amd64.zip"
            "service-lasso-tui-${CANDIDATE_VERSION}-linux-amd64.tar.gz"
            "service-lasso-tui-${CANDIDATE_VERSION}-darwin-amd64.tar.gz"
            "service-lasso-tui-${CANDIDATE_VERSION}-darwin-arm64.tar.gz"
            "SHA256SUMS.txt"
            "candidate-manifest.json"
          )
          mapfile -t actual_assets < <(jq -r '.assets[].name' <<< "$release_json" | sort)
          test "${#actual_assets[@]}" = "${#expected_assets[@]}"
          for asset_name in "${expected_assets[@]}"; do
            local_digest="$(sha256sum "release-assets/$asset_name" | cut -d ' ' -f1)"
            remote_digest="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")"
            remote_size="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .size' <<< "$release_json")"
            test "$remote_digest" = "sha256:$local_digest"
            test "$remote_size" -gt 0
          done
      - name: Upload exact candidate handoff
        uses: actions/upload-artifact@v4
        with:
          name: service-lasso-tui-candidate-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 90
