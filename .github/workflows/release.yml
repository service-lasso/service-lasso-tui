name: Publish protected develop TUI candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Exact yyyy.m.d-shortsha candidate version for the current develop commit
        required: true
        type: string
      platform_scope:
        description: Published platforms for this candidate
        required: true
        type: choice
        default: windows-linux
        options:
          - windows-linux
          - full
      operator_preflight_sha:
        description: Full candidate SHA admitted by authenticated operator admin-policy preflight
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      platform_scope: ${{ inputs.platform_scope }}
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bind explicit candidate identity to the current develop source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${#GITHUB_SHA}" = 40
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}-[0-9a-f]{7}$ ]]
          test "${CANDIDATE_VERSION##*-}" = "${GITHUB_SHA:0:7}"
          printf 'sha=%s\nversion=%s\ntag=candidate-%s\n' "$GITHUB_SHA" "$CANDIDATE_VERSION" "$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"

  platform-smoke:
    needs: validate-source
    name: ${{ matrix.name }} source and terminal smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-source.outputs.platform_scope == 'full' && '[{"name":"Windows","runner":"windows-latest"},{"name":"Linux","runner":"ubuntu-latest"},{"name":"macOS","runner":"macos-latest"}]' || '[{"name":"Windows","runner":"windows-latest"},{"name":"Linux","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test clean source
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          node scripts/assert-go-source-provenance.mjs
          go test -mod=readonly ./...
      - name: Build and smoke the attached-terminal entrypoint
        shell: bash
        env:
          GOFLAGS: ""
          GOWORK: "off"
        run: |
          set -euo pipefail
          node scripts/assert-go-source-provenance.mjs
          binary="$RUNNER_TEMP/service-lasso-tui"
          if [ "$RUNNER_OS" = Windows ]; then binary="${binary}.exe"; fi
          go build -mod=readonly -buildvcs=true -trimpath -ldflags='-s -w' -o "$binary" ./cmd/service-lasso-tui
          go version -m "$binary" | grep -F "vcs.revision=${{ needs.validate-source.outputs.sha }}" >/dev/null
          go version -m "$binary" | grep -F 'vcs.modified=false' >/dev/null
          help_status=0
          "$binary" --help > "$RUNNER_TEMP/tui-help.txt" 2>&1 || help_status=$?
          test "$help_status" = 2
          grep -F "Usage of " "$RUNNER_TEMP/tui-help.txt" >/dev/null
          grep -F -- "-connect" "$RUNNER_TEMP/tui-help.txt" >/dev/null

  package-candidate:
    needs: [validate-source, platform-smoke]
    runs-on: ubuntu-latest
    env:
      GOFLAGS: ""
      GOWORK: "off"
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
      CANDIDATE_TAG: ${{ needs.validate-source.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.sha }}
      CANDIDATE_PLATFORM_SCOPE: ${{ needs.validate-source.outputs.platform_scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build and archive the exact selected platform candidate
        shell: bash
        env:
          CANDIDATE_ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/assert-go-source-provenance.mjs
          test ! -e "$CANDIDATE_ASSET_DIR"
          mkdir -p "$CANDIDATE_ASSET_DIR/stage"
          declare -a targets=(
            "windows amd64 zip service-lasso-tui.exe win32-amd64"
            "linux amd64 tar service-lasso-tui linux-amd64"
          )
          if [ "$CANDIDATE_PLATFORM_SCOPE" = full ]; then targets+=("darwin amd64 tar service-lasso-tui darwin-amd64" "darwin arm64 tar service-lasso-tui darwin-arm64"); fi
          for target in "${targets[@]}"; do
            read -r goos goarch archive_kind executable suffix <<< "$target"
            node scripts/assert-go-source-provenance.mjs
            staged="$CANDIDATE_ASSET_DIR/stage/$executable"
            asset_base="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -mod=readonly -buildvcs=true -trimpath -ldflags='-s -w' -o "$staged" ./cmd/service-lasso-tui
            test -s "$staged"
            go version -m "$staged" | grep -F "vcs.revision=$CANDIDATE_SHA" >/dev/null
            go version -m "$staged" | grep -F 'vcs.modified=false' >/dev/null
            if [ "$archive_kind" = zip ]; then (cd "$CANDIDATE_ASSET_DIR/stage" && zip -q "../${asset_base}.zip" "$executable"); else (cd "$CANDIDATE_ASSET_DIR/stage" && tar -czf "../${asset_base}.tar.gz" "$executable"); fi
            rm -f "$staged"
          done
          rmdir "$CANDIDATE_ASSET_DIR/stage"
          (cd "$CANDIDATE_ASSET_DIR" && sha256sum service-lasso-tui-"$CANDIDATE_VERSION"-* > SHA256SUMS.txt)
      - name: Verify checksums, extraction paths, and embedded VCS provenance
        env:
          CANDIDATE_ASSET_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ASSET_DIR"
          sha256sum --check --strict SHA256SUMS.txt
          declare -a targets=("win32-amd64 zip service-lasso-tui.exe" "linux-amd64 tar service-lasso-tui")
          if [ "$CANDIDATE_PLATFORM_SCOPE" = full ]; then targets+=("darwin-amd64 tar service-lasso-tui" "darwin-arm64 tar service-lasso-tui"); fi
          for target in "${targets[@]}"; do
            read -r suffix kind executable <<< "$target"
            asset="service-lasso-tui-${CANDIDATE_VERSION}-${suffix}"
            extraction_root="$(mktemp -d)"
            if [ "$kind" = zip ]; then test "$(unzip -Z1 "$asset.zip")" = "$executable"; unzip -q "$asset.zip" -d "$extraction_root"; else test "$(tar -tzf "$asset.tar.gz")" = "$executable"; tar -xzf "$asset.tar.gz" -C "$extraction_root"; fi
            go version -m "$extraction_root/$executable" | grep -F "vcs.revision=$CANDIDATE_SHA" >/dev/null
            go version -m "$extraction_root/$executable" | grep -F 'vcs.modified=false' >/dev/null
            rm -rf "$extraction_root"
          done
      - name: Write candidate manifest and local byte inventory
        env:
          CANDIDATE_ASSET_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ASSET_DIR"
          node "$GITHUB_WORKSPACE/scripts/write-candidate-inventory.mjs"
          node "$GITHUB_WORKSPACE/scripts/verify-candidate-publication-cli.mjs" --mode publication-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --manifest candidate-manifest.json --local-assets candidate-local-assets.json --asset-directory .
      - name: Require source cleanliness after complete package verification
        shell: bash
        run: node scripts/assert-go-source-provenance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-lasso-tui-candidate-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 90

  publish-candidate:
    needs: [validate-source, package-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development-candidate
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
      CANDIDATE_TAG: ${{ needs.validate-source.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Bind checked-out source before candidate artifact retrieval
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bind-candidate-publication-source.sh "$CANDIDATE_SHA" "$GITHUB_REF" "$RUNNER_TEMP/candidate-source-binding.json" "service-lasso-tui-candidate-${CANDIDATE_VERSION}-${CANDIDATE_SHA}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: service-lasso-tui-candidate-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: release-assets
      - name: Bind downloaded fixed candidate bytes before provider reads
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-candidate-publication-cli.mjs --mode publication-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --manifest release-assets/candidate-manifest.json --local-assets release-assets/candidate-local-assets.json --asset-directory release-assets
      - name: Publish or recover through the complete protected state machine
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_PREFLIGHT_SHA: ${{ inputs.operator_preflight_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { printf 'candidate publisher authority missing\n' >&2; exit 1; }
          node scripts/publish-candidate.mjs --policy-mode actions --operator-preflight-sha "$OPERATOR_PREFLIGHT_SHA" --asset-directory release-assets --source-ref "$GITHUB_REF" --source-commit "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" > publication-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-lasso-tui-publication-receipt-${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.sha }}
          path: |
            release-assets
            publication-receipt.json
            ${{ runner.temp }}/candidate-source-binding.json
          if-no-files-found: error
          retention-days: 90
